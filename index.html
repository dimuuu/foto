<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>foto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff;
    color: #000;
    font: 13px/1.5 Arial, Helvetica, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  #canvas {
    max-width: calc(100% - 48px);
    max-height: calc(100% - 48px);
    cursor: crosshair;
    touch-action: none;
    border: 1px solid #e0e0e0;
  }
  #drop {
    position: absolute;
    inset: 24px;
    border: 1px solid #e0e0e0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    justify-content: center;
    color: #b0b0b0;
    cursor: pointer;
  }
  #drop:hover, #drop.over { color: #000; }
  #drop.hidden, #canvas.hidden { display: none; }
  #effectControl {
    position: absolute;
    display: none;
    overflow: hidden;
    pointer-events: none;
    touch-action: none;
    user-select: none;
    mix-blend-mode: difference;
  }
  #effectControl .control-visual {
    fill: none;
    stroke: #fff;
    vector-effect: non-scaling-stroke;
  }
  #effectRing {
    stroke-width: 1;
    stroke-dasharray: 4 5;
    opacity: .8;
  }
  #directionLine { stroke-width: 1; opacity: .9; }
  #moveHit {
    fill: rgba(0,0,0,.001);
    stroke: none;
    pointer-events: all;
    cursor: move;
  }
  .control-handle {
    pointer-events: all;
    cursor: grab;
    outline: none;
  }
  .control-handle:active { cursor: grabbing; }
  .control-hit { fill: rgba(0,0,0,.001); stroke: none; }
  .control-dot { fill: #fff; stroke: none; }
  #centerHandle .control-dot { r: 5; }
  #directionHandle .control-dot { r: 5; }
  #radiusHandle { cursor: nwse-resize; }
  #radiusGrip { fill: none; stroke: #fff; stroke-width: 1.5; }
  #centerCross { stroke-width: 1; }
  .control-handle:focus .control-dot,
  .control-handle:focus #radiusGrip { stroke: #fff; stroke-width: 2; }
  .control-handle:focus .control-hit { stroke: #fff; stroke-width: 1; }
  #overlay {
    position: absolute;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.45);
    color: #fff;
    pointer-events: none;
  }

  #bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    border-top: 1px solid #e0e0e0;
    flex-shrink: 0;
  }
  #bar .hint { color: #b0b0b0; visibility: hidden; }
  body.loaded #bar .hint { visibility: visible; }
  button {
    background: none;
    border: none;
    color: #000;
    font: inherit;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }
  button:hover { color: #b0b0b0; }
  #compare {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    display: grid;
    place-items: center;
    border: 1px solid #d0d0d0;
    border-radius: 50%;
    text-decoration: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    margin-left: auto;
  }
  #compare *,
  #compare svg {
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  #compare svg { width: 18px; height: 18px; }
  #compare:hover:not(:disabled) { border-color: #000; color: #000; }
  #compare.active {
    background: #000;
    border-color: #000;
    color: #fff;
  }
  #compare:disabled { opacity: .25; cursor: default; }
  #compare:focus-visible { outline: 1px solid #000; outline-offset: 2px; }
  #file { display: none; }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { cursor: pointer; }
  .toggle.busy { color: #b0b0b0; pointer-events: none; }
  @keyframes pulse { 50% { opacity: .4; } }
  .toggle.busy span { animation: pulse 1.2s ease-in-out infinite; }

  @media (max-width: 600px) {
    #drop { inset: 12px; }
    #canvas { max-width: calc(100% - 24px); max-height: calc(100% - 24px); }
    #bar {
      flex-wrap: wrap;
      gap: 10px 16px;
      padding: 10px 16px;
    }
    #bar .hint { flex-basis: 100%; order: 4; }
    body:not(.loaded) #bar .hint { display: none; }
  }
  /* the B key doesn't exist on touch devices */
  @media (hover: none) and (pointer: coarse) {
    #bar .hint { display: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="drop">
    <div>Drop an image here</div>
    <div>Or click to choose a file</div>
  </div>
  <canvas id="canvas" class="hidden"></canvas>
  <svg id="effectControl" aria-label="Displacement controls">
    <circle id="moveHit"></circle>
    <circle id="effectRing" class="control-visual"></circle>
    <line id="directionLine" class="control-visual"></line>
    <g id="centerHandle" class="control-handle" role="slider" tabindex="0" aria-label="Effect position">
      <circle class="control-hit" r="22"></circle>
      <circle class="control-dot" r="5"></circle>
      <path id="centerCross" class="control-visual" d="M-10 0H10M0-10V10"></path>
    </g>
    <g id="directionHandle" class="control-handle" role="slider" tabindex="0" aria-label="Displacement direction">
      <circle class="control-hit" r="22"></circle>
      <circle class="control-dot" r="5"></circle>
    </g>
    <g id="radiusHandle" class="control-handle" role="slider" tabindex="0" aria-label="Effect size">
      <circle class="control-hit" r="22"></circle>
      <rect id="radiusGrip" x="-5" y="-5" width="10" height="10" transform="rotate(45)"></rect>
    </g>
  </svg>
  <div id="overlay">Click to place the effect</div>
</div>

<div id="bar">
  <div class="hint">Hold B to compare.</div>
  <label class="toggle" id="bgToggle">
    <input type="checkbox" id="removebg">
    <span>Remove background</span>
  </label>
  <button id="restart">Restart</button>
  <button id="save">Export</button>
  <button id="compare" type="button" aria-label="Hold to show original" aria-pressed="false" title="Hold to show original" disabled>
    <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false" draggable="false">
      <path d="M10 3a7 7 0 0 0 0 14V3Z" fill="currentColor"></path>
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.25"></circle>
    </svg>
  </button>
</div>
<input type="file" id="file" accept="image/*">

<script>
// baked look
const P = {
  bw: 0.90,
  contrast: 1.50,
  lift: 0.10,
  blur: 1.8,
  aberration: 0.012,
  spread: 6.0,
  edgeSpread: 2.0, // displacement strength exactly at the circle edge
  radial: 1.0,     // 0 → edgeSpread inside, edgeSpread → spread outside
  angle: 0.0,      // horizontal tear
  grain: 0.09,
  grainsize: 1.0,
};

const VERT = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAG = `
precision highp float;
varying vec2 v_uv;
uniform sampler2D u_image;
uniform sampler2D u_original;
uniform vec2 u_res;
uniform vec2 u_center;
uniform vec2 u_direction;
uniform float u_radius;
uniform float u_seed;
uniform float u_bypass;
uniform float u_loading;   // 1 while the bg-removal model runs
uniform float u_time;      // seconds, drives the loading scramble
uniform float u_ampscale;  // scramble envelope, eases to 0 on finish

const float BW = ${P.bw.toFixed(4)};
const float CONTRAST = ${P.contrast.toFixed(4)};
const float LIFT = ${P.lift.toFixed(4)};
const float BLUR = ${P.blur.toFixed(4)};
const float ABERRATION = ${P.aberration.toFixed(4)};
const float SPREAD = ${P.spread.toFixed(4)};
const float EDGE_SPREAD = ${P.edgeSpread.toFixed(4)};
const float RADIAL = ${P.radial.toFixed(4)};
const float ANGLE = ${P.angle.toFixed(4)};
const float GRAIN = ${P.grain.toFixed(4)};
const float GRAINSIZE = ${P.grainsize.toFixed(4)};

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// Global motion blur keeps the baked direction; the control only affects spread.
vec3 blurSample(vec2 uv) {
  if (BLUR < 0.01) return texture2D(u_image, uv).rgb;
  vec2 dir = vec2(cos(ANGLE), sin(ANGLE)) * BLUR / u_res;
  vec3 c = vec3(0.0);
  float wsum = 0.0;
  for (int i = -4; i <= 4; i++) {
    float w = exp(-float(i * i) * 0.18);
    c += texture2D(u_image, uv + dir * float(i)).rgb * w;
    wsum += w;
  }
  return c / wsum;
}

void main() {
  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);

  if (u_bypass > 0.5) {
    gl_FragColor = vec4(texture2D(u_original, uv).rgb, 1.0);
    return;
  }

  // loading scramble: every pixel of the processed image gets a random
  // isotropic displacement whose amplitude breathes — image tears apart
  // into chaos and settles back, uniformly, with no direction or center
  float seed = u_seed;
  if (u_loading > 0.5) {
    float frame = floor(u_time * 24.0);
    float amp = (0.5 - 0.5 * cos(u_time * 2.6)) * 10.0 * u_ampscale;
    vec2 scr = vec2(
      hash(uv * u_res + vec2(31.7 + frame * 3.1, 7.3)),
      hash(uv * u_res + vec2(11.1, 91.4 + frame * 5.7))
    ) - 0.5;
    uv = clamp(uv + scr * 2.0 * amp / u_res, 0.0, 1.0);
    seed += frame * 7.31;
  }

  vec2 texel = 1.0 / u_res;
  vec2 fromCenterPx = (uv - u_center) * u_res;
  float radiusPx = max(1.0, u_radius * min(u_res.x, u_res.y));
  float range = length(fromCenterPx) / radiusPx;

  // Inside: rise smoothly from 0 at the center to EDGE_SPREAD at the ring.
  // Outside: continue from EDGE_SPREAD to full SPREAD over 45% of the radius.
  float outsideRange = max(range - 1.0, 0.0);
  float insideSpread = EDGE_SPREAD * smoothstep(0.0, 1.0, range);
  float outsideSpread = mix(
    EDGE_SPREAD,
    SPREAD,
    smoothstep(0.0, 0.45, outsideRange)
  );
  float radialSpread = mix(insideSpread, outsideSpread, step(1.0, range));
  float spreadAmt = mix(SPREAD, radialSpread, RADIAL);
  vec2 axis = normalize(u_direction);
  vec2 perp = vec2(-axis.y, axis.x);
  float along = (hash(uv * u_res + vec2(seed, 0.0)) - 0.5) * 2.0;
  float across = (hash(uv * u_res + vec2(0.0, seed + 17.0)) - 0.5) * 2.0 * 0.2;
  vec2 suv = uv + (axis * along + perp * across) * spreadAmt * texel;

  // Chromatic aberration, blur, tone, and grain remain global. The circle
  // controls only the displacement amount above.
  const vec2 imageCenter = vec2(0.5);
  vec2 d = suv - imageCenter;
  vec2 uvR = imageCenter + d * (1.0 - ABERRATION);
  vec2 uvB = imageCenter + d * (1.0 + ABERRATION);

  // desaturate before recombining so fringes stay colored on the b&w base
  vec3 sR = blurSample(uvR);
  vec3 sG = blurSample(suv);
  vec3 sB = blurSample(uvB);
  const vec3 W = vec3(0.299, 0.587, 0.114);
  vec3 col = mix(
    vec3(sR.r, sG.g, sB.b),
    vec3(dot(sR, W), dot(sG, W), dot(sB, W)),
    BW
  );

  col = (col - 0.5) * CONTRAST + 0.5;
  col = col * (1.0 - LIFT) + LIFT;

  vec2 gcell = floor(uv * u_res / GRAINSIZE);
  col += (hash(gcell + vec2(seed * 3.7, seed * 9.1)) - 0.5) * GRAIN;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
const drop = document.getElementById('drop');
const effectControl = document.getElementById('effectControl');
const moveHit = document.getElementById('moveHit');
const effectRing = document.getElementById('effectRing');
const directionLine = document.getElementById('directionLine');
const centerHandle = document.getElementById('centerHandle');
const directionHandle = document.getElementById('directionHandle');
const radiusHandle = document.getElementById('radiusHandle');
const fileInput = document.getElementById('file');
const compareButton = document.getElementById('compare');
const MAX_IMAGE_DIMENSION = 1080;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['u_image','u_original','u_res','u_center','u_direction','u_radius','u_seed','u_bypass','u_loading','u_time','u_ampscale']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

function createTexture(unit) {
  const value = gl.createTexture();
  gl.activeTexture(unit);
  gl.bindTexture(gl.TEXTURE_2D, value);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  return value;
}
const texture = createTexture(gl.TEXTURE0);
const originalTexture = createTexture(gl.TEXTURE1);
gl.uniform1i(U.u_image, 0);
gl.uniform1i(U.u_original, 1);

const DEFAULT_CENTER = [0.5, 0.42];
const DEFAULT_DIRECTION = [Math.cos(P.angle), Math.sin(P.angle)];
const DEFAULT_RADIUS = 0.32;
const MIN_RADIUS = 0.14;
const MAX_RADIUS = 0.6;
const CONTROL_INSET = 24;

const state = {
  center: [...DEFAULT_CENTER],
  direction: [...DEFAULT_DIRECTION],
  radius: DEFAULT_RADIUS,
  pointSet: false,
  seed: 1.0,
  bypass: false,
  hasImage: false,
  originalSrc: null,   // data URL of the uploaded image
  cutoutSrc: null,     // cached bg-removed version (light background)
  backgroundModel: null,
  loading: false,
  time: 0,
  ampScale: 1,
  stopAt: null,
};
let imageLoadGeneration = 0;

function render() {
  if (!state.hasImage) return;
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, originalTexture);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.u_res, canvas.width, canvas.height);
  gl.uniform2f(U.u_center, state.center[0], state.center[1]);
  gl.uniform2f(U.u_direction, state.direction[0], state.direction[1]);
  gl.uniform1f(U.u_radius, state.radius);
  gl.uniform1f(U.u_seed, state.seed);
  gl.uniform1f(U.u_bypass, state.bypass ? 1 : 0);
  gl.uniform1f(U.u_loading, state.loading ? 1 : 0);
  gl.uniform1f(U.u_time, state.time);
  gl.uniform1f(U.u_ampscale, state.ampScale);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function resizeImageForProcessing(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const largestDimension = Math.max(img.naturalWidth, img.naturalHeight);
      if (largestDimension <= MAX_IMAGE_DIMENSION) {
        resolve(src);
        return;
      }

      const scale = MAX_IMAGE_DIMENSION / largestDimension;
      const resized = document.createElement('canvas');
      resized.width = Math.max(1, Math.round(img.naturalWidth * scale));
      resized.height = Math.max(1, Math.round(img.naturalHeight * scale));
      resized.getContext('2d').drawImage(img, 0, 0, resized.width, resized.height);
      resolve(resized.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error('Could not decode image'));
    img.src = src;
  });
}

function loadImage(src) {
  const img = new Image();
  img.onload = () => {
    const expectedSrc = bgCheckbox.checked && state.cutoutSrc
      ? state.cutoutSrc
      : state.originalSrc;
    if (!expectedSrc || src !== expectedSrc) return;
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    if (src === state.originalSrc) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, originalTexture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    }
    state.hasImage = true;
    compareButton.disabled = false;
    document.body.classList.add('loaded');
    drop.classList.add('hidden');
    canvas.classList.remove('hidden');
    effectControl.style.display = state.pointSet ? 'block' : 'none';
    render();
    positionUi();
  };
  img.src = src;
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  clearComparison();
  const generation = ++imageLoadGeneration;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const resizedSrc = await resizeImageForProcessing(e.target.result);
      if (generation !== imageLoadGeneration) return;
      cancelControlDrag();
      stopLoadingFx();
      state.originalSrc = resizedSrc;
      state.cutoutSrc = null;
      state.backgroundModel = null;
      state.center = [...DEFAULT_CENTER];
      state.direction = [...DEFAULT_DIRECTION];
      state.radius = DEFAULT_RADIUS;
      state.pointSet = false;
      bgCheckbox.checked = false;
      bgToggle.classList.remove('busy');
      bgLabel.textContent = 'Remove background';
      loadImage(state.originalSrc);
    } catch (err) {
      if (generation === imageLoadGeneration) console.error(err);
    }
  };
  reader.onerror = () => {
    if (generation === imageLoadGeneration) console.error(new Error('Could not read image'));
  };
  reader.readAsDataURL(file);
}

// --- background removal (local in-browser portrait matting)
const bgToggle = document.getElementById('bgToggle');
const bgLabel = bgToggle.querySelector('span');
const bgCheckbox = document.getElementById('removebg');

// Portrait-first background removal. RVM MobileNetV3 is small enough for
// single-threaded WASM on iPhone; quantized MODNet remains the recovery path.
const WORKER_SRC = `
  const TFJS_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
  const TFJS_WASM_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js';
  const TFJS_WASM_PATH = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/';
  const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.15.1/dist/transformers.min.js';
  const MODNET_REVISION = 'fa2fa546052fba4c08921230a26cc69a333fca12';
  const RVM_NAME = 'rvm-mobilenetv3';
  let runnerPromise = null;
  let diagnostics = [];

  function debug(level, message, details = {}) {
    diagnostics.push({ level, message, details });
  }

  async function loadRVMRunner(modelURL) {
    debug('log', 'loading primary model', { model: RVM_NAME });
    const startedAt = performance.now();
    importScripts(TFJS_URL);
    importScripts(TFJS_WASM_URL);
    tf.wasm.setWasmPaths(TFJS_WASM_PATH);
    tf.wasm.setThreadsCount(1);
    await tf.setBackend('wasm');
    await tf.ready();
    const model = await tf.loadGraphModel(modelURL);
    debug('log', 'primary model ready', {
      model: RVM_NAME,
      backend: tf.getBackend(),
      ms: Math.round(performance.now() - startedAt),
    });

    return {
      name: RVM_NAME,
      dispose: () => model.dispose(),
      run: async request => {
        const width = request.width;
        const height = request.height;
        let source = null;
        let src = null;
        let ratio = null;
        let recurrent = [];
        let outputs = [];
        let alphaTensor = null;

        try {
          source = tf.tensor3d(
            new Uint8Array(request.pixels),
            [height, width, 4],
            'int32'
          );
          src = tf.tidy(() => source
            .slice([0, 0, 0], [height, width, 3])
            .toFloat()
            .div(255)
            .expandDims(0));
          source.dispose();
          source = null;

          recurrent = [tf.scalar(0), tf.scalar(0), tf.scalar(0), tf.scalar(0)];
          const shortestSide = Math.max(1, Math.min(width, height));
          ratio = tf.scalar(Math.min(1, 256 / shortestSide));
          outputs = await model.executeAsync(
            {
              src,
              r1i: recurrent[0],
              r2i: recurrent[1],
              r3i: recurrent[2],
              r4i: recurrent[3],
              downsample_ratio: ratio,
            },
            ['fgr', 'pha', 'r1o', 'r2o', 'r3o', 'r4o']
          );

          alphaTensor = tf.tidy(() => outputs[1]
            .squeeze(0)
            .squeeze(-1)
            .mul(255)
            .clipByValue(0, 255)
            .cast('int32'));
          const mask = new Uint8ClampedArray(await alphaTensor.data());
          if (mask.length !== width * height) throw new Error('Unexpected RVM output');
          return { mask, width, height };
        } finally {
          if (alphaTensor) alphaTensor.dispose();
          tf.dispose([source, src, ratio, ...recurrent, ...outputs].filter(Boolean));
        }
      },
    };
  }

  async function loadMODNetRunner() {
    debug('log', 'loading fallback model', { model: 'modnet-fallback' });
    const startedAt = performance.now();
    const { env, AutoModel, AutoProcessor, RawImage } = await import(TRANSFORMERS_URL);
    if (env.backends && env.backends.onnx && env.backends.onnx.wasm) {
      env.backends.onnx.wasm.numThreads = 1;
      env.backends.onnx.wasm.proxy = false;
    }
    const [model, processor] = await Promise.all([
      AutoModel.from_pretrained('Xenova/modnet', {
        quantized: true,
        revision: MODNET_REVISION,
      }),
      AutoProcessor.from_pretrained('Xenova/modnet', { revision: MODNET_REVISION }),
    ]);
    debug('log', 'fallback model ready', {
      model: 'modnet-fallback',
      backend: 'wasm',
      ms: Math.round(performance.now() - startedAt),
    });
    return {
      name: 'modnet-fallback',
      run: async request => {
        const image = await RawImage.fromURL(request.src);
        const { pixel_values } = await processor(image);
        const { output } = await model({ input: pixel_values });
        const matte = await RawImage.fromTensor(output[0].mul(255).to('uint8'))
          .resize(image.width, image.height);
        return { mask: matte.data, width: image.width, height: image.height };
      },
    };
  }

  function getRunner(modelURL) {
    if (!runnerPromise) {
      runnerPromise = loadRVMRunner(modelURL).catch(err => {
        debug('error', 'primary model failed to load; using fallback', {
          error: String(err && err.stack || err),
        });
        return loadMODNetRunner();
      });
    }
    return runnerPromise;
  }

  async function removeBackground(request) {
    const startedAt = performance.now();
    let runner = await getRunner(request.modelURL);
    try {
      const result = await runner.run(request);
      debug('log', 'inference complete', {
        model: runner.name,
        width: request.width,
        height: request.height,
        ms: Math.round(performance.now() - startedAt),
      });
      return { ...result, model: runner.name };
    } catch (err) {
      if (runner.name !== RVM_NAME) throw err;
      debug('error', 'primary inference failed; using fallback', {
        error: String(err && err.stack || err),
      });
      try { await runner.dispose(); } catch (e) { /* best effort */ }
      runnerPromise = loadMODNetRunner();
      runner = await runnerPromise;
      const result = await runner.run(request);
      debug('log', 'inference complete', {
        model: runner.name,
        width: request.width,
        height: request.height,
        ms: Math.round(performance.now() - startedAt),
      });
      return { ...result, model: runner.name };
    }
  }

  self.onmessage = async e => {
    diagnostics = [];
    try {
      const result = await removeBackground(e.data);
      self.postMessage({ ok: true, ...result, diagnostics }, [result.mask.buffer]);
    } catch (err) {
      self.postMessage({
        ok: false,
        error: String(err && err.stack || err),
        diagnostics,
      });
    }

`;
let bgWorker = null;
function resetBackgroundWorker() {
  if (bgWorker) bgWorker.terminate();
  bgWorker = null;
}
function removeBackgroundInWorker(src, pixels, width, height) {
  if (!bgWorker) {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    bgWorker = new Worker(url);
    URL.revokeObjectURL(url);
  }
  return new Promise((resolve, reject) => {
    const fail = error => {
      clearTimeout(timeout);
      resetBackgroundWorker();
      reject(error);
    };
    const timeout = setTimeout(
      () => fail(new Error('Background removal timed out')),
      180000
    );
    bgWorker.onmessage = e => {
      clearTimeout(timeout);
      for (const entry of e.data.diagnostics || []) {
        const method = entry.level === 'error' ? 'error' : 'log';
        console[method]('[foto:bg] ' + entry.message, entry.details);
      }
      e.data.ok ? resolve(e.data) : fail(new Error(e.data.error));
    };
    bgWorker.onerror = e => fail(new Error(e.message || 'worker failed'));
    bgWorker.postMessage({
      src,
      pixels: pixels.buffer,
      width,
      height,
      modelURL: new URL('models/rvm/model.json', location.href).href,
    });
  });
}

// glitch-sweep loading state on the canvas while the model runs
let loadingRaf = null;
const STOP_DUR = 700; // ms, scramble settle time
function startLoadingFx() {
  const t0 = performance.now();
  state.loading = true;
  state.ampScale = 1;
  state.stopAt = null;
  const tick = now => {
    state.time = (now - t0) / 1000;
    if (state.stopAt !== null) {
      // ease the scramble amplitude down instead of cutting it
      const p = Math.min(1, (now - state.stopAt) / STOP_DUR);
      state.ampScale = Math.pow(1 - p, 3); // ease-out cubic decay
      if (p >= 1) {
        state.loading = false;
        state.ampScale = 1;
        render();
        return;
      }
    }
    render();
    loadingRaf = requestAnimationFrame(tick);
  };
  loadingRaf = requestAnimationFrame(tick);
}
function stopLoadingFx() {
  if (!state.loading) return;
  state.stopAt = performance.now();
}

async function makeCutout() {
  bgLabel.textContent = 'Removing background…';
  const img = new Image();
  img.src = state.originalSrc;
  await img.decode();
  const width = img.naturalWidth;
  const height = img.naturalHeight;
  const cut = document.createElement('canvas');
  cut.width = width;
  cut.height = height;
  const cctx = cut.getContext('2d');
  cctx.drawImage(img, 0, 0, width, height);
  const id = cctx.getImageData(0, 0, width, height);
  console.log('[foto:bg] removal requested', { width, height });
  const result = await removeBackgroundInWorker(
    state.originalSrc,
    id.data,
    width,
    height
  );
  if (result.width !== width || result.height !== height) {
    throw new Error('Unexpected background-removal dimensions');
  }
  state.backgroundModel = result.model;
  console.log('[foto:bg] removal applied', {
    model: result.model,
    width: result.width,
    height: result.height,
  });
  // apply the matte as the alpha channel
  for (let i = 0; i < result.mask.length; i++) id.data[i * 4 + 3] = result.mask[i];
  cctx.putImageData(id, 0, 0);
  // composite onto the light background
  const out = document.createElement('canvas');
  out.width = width;
  out.height = height;
  const octx = out.getContext('2d');
  const background = octx.createLinearGradient(0, 0, 0, height);
  background.addColorStop(0, '#d8d8d8');
  background.addColorStop(1, '#c8c8c8');
  octx.fillStyle = background;
  octx.fillRect(0, 0, width, height);
  octx.drawImage(cut, 0, 0);
  return out.toDataURL('image/png');
}

bgCheckbox.addEventListener('change', async () => {
  if (!state.hasImage) { bgCheckbox.checked = false; return; }
  if (bgCheckbox.checked && !state.cutoutSrc) {
    const srcAtStart = state.originalSrc;
    bgToggle.classList.add('busy');
    startLoadingFx();
    try {
      const cutout = await makeCutout();
      if (state.originalSrc !== srcAtStart) {
        bgToggle.classList.remove('busy');
        bgLabel.textContent = 'Remove background';
        stopLoadingFx();
        return;
      }
      state.cutoutSrc = cutout;
    } catch (err) {
      console.error(err);
      bgCheckbox.checked = false;
      bgLabel.textContent = 'Failed. Try again?';
      bgToggle.classList.remove('busy');
      stopLoadingFx();
      return;
    }
    bgToggle.classList.remove('busy');
    bgLabel.textContent = 'Remove background';
    stopLoadingFx();
  }
  loadImage(bgCheckbox.checked ? state.cutoutSrc : state.originalSrc);
});

drop.addEventListener('click', () => fileInput.click());
document.getElementById('restart').addEventListener('click', () => {
  imageLoadGeneration++;
  cancelControlDrag();
  clearComparison();
  stopLoadingFx();
  state.hasImage = false;
  compareButton.disabled = true;
  state.originalSrc = null;
  state.cutoutSrc = null;
  state.backgroundModel = null;
  state.center = [...DEFAULT_CENTER];
  state.direction = [...DEFAULT_DIRECTION];
  state.radius = DEFAULT_RADIUS;
  state.pointSet = false;
  bgCheckbox.checked = false;
  bgToggle.classList.remove('busy');
  bgLabel.textContent = 'Remove background';
  canvas.classList.add('hidden');
  effectControl.style.display = 'none';
  overlay.style.display = 'none';
  drop.classList.remove('hidden');
  document.body.classList.remove('loaded');
  fileInput.value = '';
});
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

document.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
document.addEventListener('dragleave', () => drop.classList.remove('over'));
document.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  handleFile(e.dataTransfer.files[0]);
});
document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) handleFile(item.getAsFile());
});

const overlay = document.getElementById('overlay');
if (matchMedia('(hover: none) and (pointer: coarse)').matches) {
  overlay.textContent = 'Tap to place the effect';
}
function controlBounds(width, height) {
  const insetX = Math.min(CONTROL_INSET, width * 0.06);
  const insetY = Math.min(CONTROL_INSET, height * 0.06);
  return { insetX, insetY };
}

function constrainCenter(center, width, height) {
  const { insetX, insetY } = controlBounds(width, height);
  return [
    Math.min(1 - insetX / width, Math.max(insetX / width, center[0])),
    Math.min(1 - insetY / height, Math.max(insetY / height, center[1])),
  ];
}

function positionUi() {
  if (!state.hasImage) return;
  const r = canvas.getBoundingClientRect();
  const stage = document.getElementById('stage').getBoundingClientRect();
  const left = r.left - stage.left;
  const top = r.top - stage.top;
  const width = r.width;
  const height = r.height;
  const constrainedCenter = constrainCenter(state.center, width, height);
  if (constrainedCenter[0] !== state.center[0] || constrainedCenter[1] !== state.center[1]) {
    state.center = constrainedCenter;
    render();
  }
  const { insetX, insetY } = controlBounds(width, height);
  const shortestSide = Math.min(width, height);
  const cx = state.center[0] * width;
  const cy = state.center[1] * height;
  const radius = state.radius * shortestSide;

  const raySpace = (dx, dy) => {
    let space = Infinity;
    if (Math.abs(dx) > 0.0001) {
      const edgeX = dx > 0 ? width - insetX : insetX;
      space = Math.min(space, (edgeX - cx) / dx);
    }
    if (Math.abs(dy) > 0.0001) {
      const edgeY = dy > 0 ? height - insetY : insetY;
      space = Math.min(space, (edgeY - cy) / dy);
    }
    return Math.max(0, space);
  };

  let visualDirection = state.direction;
  if (!activeControlDrag || activeControlDrag.mode !== 'direction') {
    const forwardSpace = raySpace(state.direction[0], state.direction[1]);
    const backwardSpace = raySpace(-state.direction[0], -state.direction[1]);
    if (backwardSpace > forwardSpace) {
      visualDirection = [-state.direction[0], -state.direction[1]];
    }
  }
  const directionLength = Math.min(
    radius * 0.62,
    raySpace(visualDirection[0], visualDirection[1])
  );
  const directionX = cx + visualDirection[0] * directionLength;
  const directionY = cy + visualDirection[1] * directionLength;

  // Keep the resize grip on the ring, toward the farthest available corner.
  const targetX = cx < width * 0.5 ? width - insetX : insetX;
  const targetY = cy < height * 0.5 ? height - insetY : insetY;
  const radiusDx = targetX - cx;
  const radiusDy = targetY - cy;
  const radiusTargetDistance = Math.max(1, Math.hypot(radiusDx, radiusDy));
  const radiusHandleDistance = Math.min(radius, radiusTargetDistance);
  const radiusX = cx + radiusDx / radiusTargetDistance * radiusHandleDistance;
  const radiusY = cy + radiusDy / radiusTargetDistance * radiusHandleDistance;

  overlay.style.left = left + 'px';
  overlay.style.top = top + 'px';
  overlay.style.width = width + 'px';
  overlay.style.height = height + 'px';
  overlay.style.display = state.pointSet ? 'none' : 'flex';

  effectControl.style.left = left + 'px';
  effectControl.style.top = top + 'px';
  effectControl.style.width = width + 'px';
  effectControl.style.height = height + 'px';
  effectControl.setAttribute('viewBox', `0 0 ${width} ${height}`);
  effectControl.style.display = state.pointSet ? 'block' : 'none';

  moveHit.setAttribute('cx', cx);
  moveHit.setAttribute('cy', cy);
  moveHit.setAttribute('r', radius);
  effectRing.setAttribute('cx', cx);
  effectRing.setAttribute('cy', cy);
  effectRing.setAttribute('r', radius);
  directionLine.setAttribute('x1', cx);
  directionLine.setAttribute('y1', cy);
  directionLine.setAttribute('x2', directionX);
  directionLine.setAttribute('y2', directionY);
  centerHandle.setAttribute('transform', `translate(${cx} ${cy})`);
  directionHandle.setAttribute('transform', `translate(${directionX} ${directionY})`);
  radiusHandle.setAttribute('transform', `translate(${radiusX} ${radiusY})`);

  centerHandle.setAttribute('aria-valuenow', Math.round(state.center[0] * 100));
  centerHandle.setAttribute('aria-valuemin', '0');
  centerHandle.setAttribute('aria-valuemax', '100');
  centerHandle.setAttribute(
    'aria-valuetext',
    `${Math.round(state.center[0] * 100)}%, ${Math.round(state.center[1] * 100)}%`
  );
  const angle = (Math.atan2(visualDirection[1], visualDirection[0]) * 180 / Math.PI + 360) % 360;
  directionHandle.setAttribute('aria-valuenow', Math.round(angle));
  directionHandle.setAttribute('aria-valuemin', '0');
  directionHandle.setAttribute('aria-valuemax', '359');
  radiusHandle.setAttribute('aria-valuenow', Math.round(state.radius * 100));
  radiusHandle.setAttribute('aria-valuemin', Math.round(MIN_RADIUS * 100));
  radiusHandle.setAttribute('aria-valuemax', Math.round(MAX_RADIUS * 100));
}
window.addEventListener('resize', positionUi);

function pointerInCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return {
    r,
    x: e.clientX - r.left,
    y: e.clientY - r.top,
  };
}

let activeControlDrag = null;
function beginControlDrag(mode, e, preserveOffset = false) {
  e.preventDefault();
  e.stopPropagation();
  if (activeControlDrag) return;
  const p = pointerInCanvas(e);
  activeControlDrag = {
    mode,
    pointerId: e.pointerId,
    captureTarget: e.currentTarget,
    offset: preserveOffset
      ? [state.center[0] - p.x / p.r.width, state.center[1] - p.y / p.r.height]
      : [0, 0],
  };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  if (mode === 'center') updateControlDrag(e);
  window.addEventListener('pointermove', updateControlDrag, { passive: false });
  window.addEventListener('pointerup', endControlDrag);
  window.addEventListener('pointercancel', endControlDrag);
}

function updateControlDrag(e) {
  if (!activeControlDrag || e.pointerId !== activeControlDrag.pointerId) return;
  if (e.cancelable) e.preventDefault();
  const p = pointerInCanvas(e);
  if (activeControlDrag.mode === 'center') {
    state.center = constrainCenter(
      [
        p.x / p.r.width + activeControlDrag.offset[0],
        p.y / p.r.height + activeControlDrag.offset[1],
      ],
      p.r.width,
      p.r.height
    );
  } else if (activeControlDrag.mode === 'direction') {
    const dx = p.x - state.center[0] * p.r.width;
    const dy = p.y - state.center[1] * p.r.height;
    const length = Math.hypot(dx, dy);
    if (length > 2) state.direction = [dx / length, dy / length];
  } else if (activeControlDrag.mode === 'radius') {
    const dx = p.x - state.center[0] * p.r.width;
    const dy = p.y - state.center[1] * p.r.height;
    state.radius = Math.min(
      MAX_RADIUS,
      Math.max(MIN_RADIUS, Math.hypot(dx, dy) / Math.min(p.r.width, p.r.height))
    );
  }
  render();
  positionUi();
}

function cancelControlDrag() {
  const drag = activeControlDrag;
  activeControlDrag = null;
  window.removeEventListener('pointermove', updateControlDrag);
  window.removeEventListener('pointerup', endControlDrag);
  window.removeEventListener('pointercancel', endControlDrag);
  if (drag) {
    const { captureTarget, pointerId } = drag;
    try {
      if (captureTarget?.hasPointerCapture(pointerId)) captureTarget.releasePointerCapture(pointerId);
    } catch (_) {}
  }
}

function endControlDrag(e) {
  if (!activeControlDrag || e.pointerId !== activeControlDrag.pointerId) return;
  cancelControlDrag();
}
window.addEventListener('blur', cancelControlDrag);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancelControlDrag();
});

moveHit.addEventListener('pointerdown', e => beginControlDrag('center', e, true));
centerHandle.addEventListener('pointerdown', e => beginControlDrag('center', e, true));
directionHandle.addEventListener('pointerdown', e => beginControlDrag('direction', e));
radiusHandle.addEventListener('pointerdown', e => beginControlDrag('radius', e));
[canvas, moveHit, centerHandle, directionHandle, radiusHandle].forEach(element => {
  element.addEventListener('lostpointercapture', e => {
    if (activeControlDrag?.pointerId === e.pointerId) cancelControlDrag();
  });
});

canvas.addEventListener('pointerdown', e => {
  state.pointSet = true;
  beginControlDrag('center', e);
});

centerHandle.addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const step = e.shiftKey ? 0.05 : 0.01;
  if (e.key === 'ArrowLeft') state.center[0] -= step;
  if (e.key === 'ArrowRight') state.center[0] += step;
  if (e.key === 'ArrowUp') state.center[1] -= step;
  if (e.key === 'ArrowDown') state.center[1] += step;
  const r = canvas.getBoundingClientRect();
  state.center = constrainCenter(state.center, r.width, r.height);
  render();
  positionUi();
});

directionHandle.addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const current = Math.atan2(state.direction[1], state.direction[0]);
  const step = (e.shiftKey ? 15 : 5) * Math.PI / 180;
  const next = current + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -step : step);
  state.direction = [Math.cos(next), Math.sin(next)];
  render();
  positionUi();
});

radiusHandle.addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const step = e.shiftKey ? 0.05 : 0.01;
  const grow = e.key === 'ArrowRight' || e.key === 'ArrowUp';
  state.radius = Math.min(MAX_RADIUS, Math.max(MIN_RADIUS, state.radius + (grow ? step : -step)));
  render();
  positionUi();
});

const comparisonSources = new Set();
function updateComparison() {
  const active = state.hasImage && comparisonSources.size > 0;
  state.bypass = active;
  compareButton.classList.toggle('active', active);
  compareButton.setAttribute('aria-pressed', String(active));
  render();
}
function setComparisonSource(source, active) {
  active ? comparisonSources.add(source) : comparisonSources.delete(source);
  updateComparison();
}
function clearComparison() {
  comparisonSources.clear();
  updateComparison();
}

compareButton.addEventListener('pointerdown', e => {
  if (compareButton.disabled) return;
  e.preventDefault();
  window.getSelection()?.removeAllRanges();
  compareButton.blur();
  try { compareButton.setPointerCapture(e.pointerId); } catch (_) {}
  setComparisonSource('pointer-' + e.pointerId, true);
});
const endPointerComparison = e => {
  setComparisonSource('pointer-' + e.pointerId, false);
  compareButton.blur();
};
compareButton.addEventListener('pointerup', endPointerComparison);
compareButton.addEventListener('pointercancel', endPointerComparison);
compareButton.addEventListener('lostpointercapture', endPointerComparison);
window.addEventListener('pointerup', endPointerComparison);
window.addEventListener('pointercancel', endPointerComparison);
compareButton.addEventListener('contextmenu', e => e.preventDefault());
compareButton.addEventListener('keydown', e => {
  if (![' ', 'Enter'].includes(e.key) || e.repeat) return;
  e.preventDefault();
  setComparisonSource('button-keyboard', true);
});
compareButton.addEventListener('keyup', e => {
  if (![' ', 'Enter'].includes(e.key)) return;
  e.preventDefault();
  setComparisonSource('button-keyboard', false);
});
compareButton.addEventListener('blur', () => {
  setComparisonSource('button-keyboard', false);
});

document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'b' && !e.repeat) setComparisonSource('keyboard-b', true);
});
document.addEventListener('keyup', e => {
  if (e.key.toLowerCase() === 'b') setComparisonSource('keyboard-b', false);
});
window.addEventListener('blur', clearComparison);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearComparison();
});

document.getElementById('save').addEventListener('click', () => {
  if (!state.hasImage) return;
  render();
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'foto-export.png';
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
});
